<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toons de Pesadilla · Intro</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #0B0B0C; overflow: hidden; }
    body { font-family: "Special Elite", "Courier New", monospace; color: #E4DCC8; }

    #inicio { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding: 0 16px; }
    #inicio p { margin: 0; letter-spacing: 3px; color: #B3122B; }
    #inicio h1 { margin: 0; font-weight: 400; text-transform: uppercase; font-size: clamp(32px, 6vw, 72px); }
    button { font-family: inherit; font-size: 20px; padding: 14px 28px; border: 2px solid #E4DCC8; background: #0B0B0C; color: #E4DCC8; cursor: pointer; }
    button:hover { background: #B3122B; border-color: #B3122B; }

    #video { display: none; position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    #saltar { display: none; position: fixed; right: 20px; bottom: 20px; z-index: 5; font-size: 16px; padding: 10px 18px; opacity: .7; }
    #saltar:hover { opacity: 1; }
  </style>
</head>
<body>

  <div id="inicio">
    <p>ARCHIVO Nº 13</p>
    <h1>Toons de Pesadilla</h1>
    <button id="entrar" type="button">Abrir el expediente</button>
  </div>

  <video id="video" src="video/intro.mp4" playsinline preload="auto"></video>
  <button id="saltar" type="button">Saltar intro ›</button>

  <script>
    var inicio = document.getElementById('inicio');
    var video = document.getElementById('video');
    var btnEntrar = document.getElementById('entrar');
    var btnSaltar = document.getElementById('saltar');

    function irALaWeb() {
      window.location.href = 'login.php';
    }

    btnEntrar.addEventListener('click', function () {
      inicio.style.display = 'none';
      video.style.display = 'block';
      btnSaltar.style.display = 'block';
      video.play().catch(irALaWeb);
    });

    video.addEventListener('ended', irALaWeb);
    btnSaltar.addEventListener('click', irALaWeb);
  </script>

</body>
</html>
