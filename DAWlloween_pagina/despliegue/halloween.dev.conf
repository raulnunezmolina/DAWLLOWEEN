# Virtual Host de Toons de Pesadilla
# Ruta en Ubuntu/Kali: /etc/apache2/sites-available/halloween.dev.conf
<VirtualHost *:80>
    ServerName halloween.dev
    ServerAlias www.halloween.dev
    DocumentRoot /var/www/halloween.dev/public_html

    <Directory /var/www/halloween.dev/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/halloween.dev-error.log
    CustomLog ${APACHE_LOG_DIR}/halloween.dev-access.log combined
</VirtualHost>
